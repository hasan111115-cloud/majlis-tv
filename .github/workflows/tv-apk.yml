name: TV app (APK)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04  # فيها Android SDK جاهز
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Build web
        run: |
          npm ci
          npm run build

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Build APK
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          gradle --no-daemon assembleRelease

      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk majlis-tv.apk

      - uses: actions/upload-artifact@v4
        with:
          name: majlis-tv-apk
          path: majlis-tv.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv-${{ github.run_number }}
          name: تطبيق مجلس للتلفزيون — نسخة ${{ github.run_number }}
          body: |
            ثبّت `majlis-tv.apk` على التلفزيون (أندرويد تي في / قوقل تي في).
            رابط آخر نسخة دائمًا: https://github.com/${{ github.repository }}/releases/latest/download/majlis-tv.apk
          files: majlis-tv.apk
          make_latest: true
