plugins { id 'com.android.application' }

def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer

android {
    namespace 'sa.majlis.tv'
    compileSdk 35

    defaultConfig {
        applicationId 'sa.majlis.tv'
        minSdk 23
        targetSdk 35
        versionCode runNumber
        versionName "1.0.${runNumber}"
    }

    // مفتاح توقيع ثابت حتى تُثبَّت التحديثات فوق النسخة القديمة دون حذف الإعدادات
    signingConfigs {
        majlis {
            storeFile file('../majlis.keystore')
            storePassword 'majlis-tv'
            keyAlias 'majlis'
            keyPassword 'majlis-tv'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.majlis
        }
    }

    // الموقع المبني (dist) يُضمَّن داخل التطبيق فيعمل بدون استضافة
    sourceSets {
        main { assets.srcDirs += ['../../dist'] }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
